<!DOCTYPE html>
<html>
    <head>
        <title>My Colour Card</title>
        <!--Internal CSS-->
        <style>
            *{
              font-family:cursive;
            }
            body{
              background-color:lightblue;
            }
            h1{
                color:navy;
            }
            /*CLASS SELECTOR*/
            .about{
               color:blue;
               font-weight:bold;
            }
            /*ID SELECTOR*/
            #cat{
                color:maroon;
            }
        </style>
    </head>
    <body>
        <h1>My Colour Card</h1>
        <!--Inline CSS-->
        <p style="color:red">Hi.This is my Website.</p>
        <h2>About me</h2>
        <p class="about">I like books</p>
        <p class="about" id="cat">I like cats</p>
        <p class="about">My favourite colour is black</p>
    </body>
</html>
