<!DOCTYPE html>
<html>
    <head>
        <title>Thunder Kid</title>
        <style>
            body{
              background-color:darkblue;
              color:white;
              font-family:Arial, sans-serif;
            }

            .hero-name{
                font-size:60px;
                color:yellow;
                text-shadow:3px 3px 15px orange;
            }

            .tagline{
                font-style:italic;
                color:lightblue;
                text-transform:capitalize;
            }

            .label{
                text-transform:uppercase;
                text-decoration:underline;
                color:coral;
            }

            .power{
                font-weight:bold;
                color:lightgreen;
            }

            .weakness{
              text-decoration:line-through;
              color:gray;
            }

            .badge{
                font-size:28px;
                font-weight:bold;
                color:gold;
                transform:rotate(10deg);
            }

            .made-by{
                font-style:italic;
                color:coral;
            }
        </style>
    </head>
    <body>
        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">the most powerful hero in the school</p>

        <h2 class="label">superpowers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <p class="power">Can lift a school bus</p>

        <h2 class="label">weaknesses</h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness">Broccoli</p>
        
        <p class="badge">Top Hero</p>

        <p class="made-by">Created by Shavindu</p>
    </body>
</html>
