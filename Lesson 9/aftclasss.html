<!DOCTYPE html>
<html>
    <head>
        <title>My Restauraunt</title>
        <style>
            body{
              background-color:whitesmoke;
              color:black;
              font-family:Arial, sans-serif;
            }

            .restaurant-name{
                font-size:60px;
                color:white;
                text-shadow:3px 3px 8px gold;
            }

            .tagline{
                font-style:italic;
                font-weight:bold;
                font-size:20px;
                color:black;
                text-transform:capitalize;
            }

            .label{
                text-transform:uppercase;
                text-decoration:underline;
                color:gold;
            }

            .food{
                font-weight:bold;
                color:black;
            }

            .discounts{
              text-decoration:line-through;
              color:gray;
            }

            .badge{
                font-size:28px;
                font-weight:bold;
                color:gold;
                transform:rotate(10deg);
            }

            .made-by{
                font-style:italic;
                font-weight:bold;
                color:gold;
            }
        </style>
    </head>
    <body>
        <h1 class="restaurant-name">The Best Restaurant</h1>
        <p class="tagline">the world's best restaurant.</p>

        <h2 class="label">Dishes</h2>
        <p class="food">Chicken Sandwich (Burger)</p>
        <p class="food">Pizza</p>
        <p class="food">Soup with croutons</p>
        <p class="food">Chocalate Eclairs</p>
        <p class="food">Donuts</p>
        <p class="food">Salads</p>

        <h2 class="label">discounts</h2>
        <p class="discounts">£100 to £99</p>
        <p class="discounts">£20 to £18</p>
        
        <p class="badge">Top Restaurant</p>

        <p class="made-by">Created by Shavindu</p>
    </body>
</html>
